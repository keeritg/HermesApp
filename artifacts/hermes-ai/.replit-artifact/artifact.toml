kind = "web"
previewPath = "/"
title = "HermesAI"
version = "1.0.0"
id = "artifacts/hermes-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25049

[services.development]
run = "pnpm --filter @workspace/hermes-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hermes-ai", "run", "build" ]
publicDir = "artifacts/hermes-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25049"
BASE_PATH = "/"
